# ./play reads these settings when it starts the local database.
services:
  db:
    # vcpus: 0.01 up to the number available to docker, or 0 for unlimited.
    # 0.0625 gives postgres 1/16 of one core.
    cpus: 0.0625

    # ram: 6m or more. examples for postgres: 256m, 512m, 1g.
    mem_limit: &ram 512m

    # ram + swap: *ram disables swap. with 512m ram, 1g allows 512m of swap.
    # use a value at least as large as ram, or -1 for unlimited swap.
    memswap_limit: *ram

  play:
    environment:
      # extra round-trip delay per gameplay query, in milliseconds. 0 disables it.
      # any finite number >= 0. 46 adds 23 ms each way.
      DOOM_RTT_MS: "46"

      PGHOST: db
      PGUSER: postgres
      PGDATABASE: doom
      PGPASSWORD: doom
