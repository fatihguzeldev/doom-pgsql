# local play only
services:
  db:
    # vcpus: 0.01 to the number available to docker, or 0 for unlimited. 0.0625 = 1/16 core.
    cpus: 0.0625

    # ram: 6m or more, e.g. 256m, 512m or 1g.
    mem_limit: &ram 512m

    # total ram + swap: *ram disables swap. use a larger value to allow swap, or -1 for unlimited.
    memswap_limit: *ram

  play:
    environment:
      # simulated round-trip delay per gameplay query in ms. any finite number >= 0. use 0 to disable.
      DOOM_RTT_MS: "46"

      PGHOST: db
      PGUSER: postgres
      PGDATABASE: doom
      PGPASSWORD: doom
